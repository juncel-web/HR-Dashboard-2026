<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGB HR Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #F2EFE9;
  --bg2:      #EAE6DF;
  --cream:    #FAF8F4;
  --dark:     #1C1C1A;
  --dark2:    #2A2A27;
  --gold:     #B8892A;
  --gold2:    #D4A843;
  --gold-pale:#F0DFA8;
  --green:    #2D5A3D;
  --green2:   #3D7A52;
  --green-pale:#C8DDD0;
  --rust:     #8B3A2A;
  --rust2:    #B04A35;
  --rust-pale:#E8C4BB;
  --amber:    #8B6A1A;
  --amber-pale:#EDD9A0;
  --slate:    #4A5568;
  --border:   #D5CFC4;
  --text:     #1C1C1A;
  --text-dim: #6B6B60;
  --text-muted:#9A9A8E;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Mulish',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(184,137,42,.18) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(45,90,61,.12) 0%,transparent 50%);}
#login-screen::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green2),var(--gold2),var(--rust2));}
.login-card{background:var(--cream);border-radius:16px;padding:48px 44px 40px;width:420px;position:relative;box-shadow:0 40px 100px rgba(0,0,0,.55);animation:cardIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.login-logo{text-align:center;margin-bottom:32px;}
.logo-mark{width:52px;height:52px;background:var(--dark);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--gold2);}
.login-logo h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--dark);font-weight:700;}
.login-logo p{color:var(--text-dim);font-size:10px;margin-top:4px;letter-spacing:2.5px;text-transform:uppercase;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:10px;font-weight:700;color:var(--text-dim);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase;}
.form-group select,.form-group input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Mulish',sans-serif;font-size:13px;padding:10px 13px;outline:none;transition:border-color .2s;appearance:none;}
.form-group select:focus,.form-group input:focus{border-color:var(--gold);}
.select-wrap{position:relative;}
.select-wrap::after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;}
.btn-login{width:100%;padding:12px;border-radius:8px;border:none;background:var(--dark);color:#fff;font-family:'Mulish',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.5px;margin-top:6px;transition:background .2s,transform .1s;}
.btn-login:hover{background:var(--dark2);transform:translateY(-1px);}
.login-error{color:var(--rust2);font-size:12px;text-align:center;margin-top:10px;min-height:16px;}

/* APP */
#app{display:none;min-height:100vh;flex-direction:column;}

/* HEADER */
header{background:var(--dark);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;border-bottom:2px solid var(--gold);}
.header-left{display:flex;align-items:center;gap:14px;}
.h-logo-mark{width:36px;height:36px;background:var(--gold2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--dark);}
.h-brand-name{font-family:'Playfair Display',serif;font-size:16px;color:#fff;font-weight:700;line-height:1.1;}
.h-brand-sub{font-size:9px;color:var(--gold2);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
.header-right{display:flex;align-items:center;gap:10px;}
.h-role-badge{background:rgba(184,137,42,.2);border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;letter-spacing:.5px;}
.h-viewonly-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.45);border-radius:20px;padding:4px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.15);}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);font-family:'Mulish',sans-serif;font-size:11px;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .2s;}
.btn-logout:hover{border-color:var(--rust2);color:#e88;}

/* LAYOUT */
.app-body{display:flex;flex:1;min-height:calc(100vh - 62px);}

/* SIDEBAR */
nav{width:210px;background:var(--dark2);border-right:1px solid rgba(255,255,255,.06);padding:20px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.nav-section-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:2.5px;text-transform:uppercase;padding:14px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.45);cursor:pointer;transition:all .15s;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);}
.nav-item.active{background:rgba(184,137,42,.15);color:var(--gold2);}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* MAIN */
main{flex:1;padding:28px 32px;overflow-y:auto;background:var(--bg);}
.page{display:none;animation:fadeUp .25s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.page-header h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--dark);}
.page-header p{color:var(--text-dim);font-size:12px;margin-top:3px;}
.section-label{font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:12px;}

/* SCORECARD STRIP */
.scorecard-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:28px;}
.score-card{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;position:relative;overflow:hidden;transition:box-shadow .2s;}
.score-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
.score-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0;}
.score-card.green::before{background:var(--green2);}
.score-card.gold::before{background:var(--gold2);}
.score-card.rust::before{background:var(--rust2);}
.score-card.amber::before{background:var(--amber);}
.score-card.slate::before{background:var(--slate);}
.sc-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-bottom:8px;}
.sc-badge.green{background:var(--green-pale);color:var(--green);}
.sc-badge.gold{background:var(--gold-pale);color:var(--gold);}
.sc-badge.rust{background:var(--rust-pale);color:var(--rust);}
.sc-badge.amber{background:var(--amber-pale);color:var(--amber);}
.sc-badge.slate{background:#E8EAED;color:var(--slate);}
.sc-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;}
.sc-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--dark);line-height:1;margin:4px 0 2px;}
.sc-sub{font-size:11px;color:var(--text-dim);}

/* QUARTERS GRID */
.quarters-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.q-card{border-radius:12px;padding:18px;color:#fff;position:relative;overflow:hidden;}
.q-card.q1{background:#2A3540;}
.q-card.q2{background:#2D4A35;}
.q-card.q3{background:#6B5020;}
.q-card.q4{background:#6B3020;}
.q-period{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-bottom:2px;}
.q-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.q-theme{font-size:11px;opacity:.55;margin-bottom:14px;}
.q-pct-badge{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.9);}
.q-item{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;}
.q-item:last-of-type{margin-bottom:0;}
.q-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:2px;border:2px solid rgba(255,255,255,.4);}
.q-dot.done{background:#6ECF9A;border-color:#6ECF9A;}
.q-dot.progress{background:var(--gold2);border-color:var(--gold2);}
.q-dot.risk{background:#E8776A;border-color:#E8776A;}
.q-dot.ns{background:transparent;}
.q-item-text{font-size:12px;line-height:1.4;}
.q-item-owner{font-size:10px;opacity:.5;margin-top:1px;}
.q-progress-bar{margin-top:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;}
.q-progress-label{display:flex;justify-content:space-between;font-size:10px;opacity:.55;margin-bottom:5px;}
.q-progress-track{background:rgba(255,255,255,.12);border-radius:20px;height:4px;}
.q-progress-fill{height:4px;border-radius:20px;background:rgba(255,255,255,.55);transition:width .5s ease;}

/* METRICS TABLE */
.metrics-table-wrap{background:var(--cream);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
.metrics-table-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg2);}
.metrics-table-head h3{font-size:14px;font-weight:700;color:var(--dark);font-family:'Playfair Display',serif;}
table.metrics{width:100%;border-collapse:collapse;}
table.metrics th{padding:9px 18px;text-align:left;font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border);background:var(--bg2);}
table.metrics td{padding:12px 18px;border-bottom:1px solid rgba(213,207,196,.5);font-size:13px;}
table.metrics tr:last-child td{border-bottom:none;}
table.metrics tr:hover td{background:rgba(0,0,0,.015);}
.metric-actual{font-weight:700;color:var(--dark);}
.metric-target{color:var(--text-dim);}
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.status-pill.on-track{background:var(--green-pale);color:var(--green);}
.status-pill.behind{background:var(--amber-pale);color:var(--amber);}
.status-pill.at-risk{background:var(--rust-pale);color:var(--rust);}
.vs-bar{display:flex;align-items:center;gap:8px;}
.bar-track{flex:1;height:6px;background:var(--bg2);border-radius:20px;max-width:120px;}
.bar-fill{height:6px;border-radius:20px;}
.bar-fill.on-track{background:var(--green2);}
.bar-fill.behind{background:var(--gold2);}
.bar-fill.at-risk{background:var(--rust2);}

/* CARDS */
.card{background:var(--cream);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;}
.card-header{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);}
.card-header h3{font-size:13px;font-weight:700;font-family:'Playfair Display',serif;}
.card-body{padding:18px;}

/* KPI MINI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:16px;border-left:3px solid var(--border);}
.kpi-card.green{border-left-color:var(--green2);}
.kpi-card.gold{border-left-color:var(--gold2);}
.kpi-card.rust{border-left-color:var(--rust2);}
.kpi-card.amber{border-left-color:var(--amber);}
.kpi-card.slate{border-left-color:var(--slate);}
.kpi-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;}
.kpi-value{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--dark);margin:5px 0 3px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--text-dim);}
.kpi-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:6px;}
.kpi-badge.up{background:var(--green-pale);color:var(--green);}
.kpi-badge.down{background:var(--rust-pale);color:var(--rust);}
.kpi-badge.warn{background:var(--amber-pale);color:var(--amber);}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:2px solid var(--border);}
.tab{padding:9px 18px;font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;text-transform:uppercase;letter-spacing:.5px;}
.tab.active{color:var(--dark);border-bottom-color:var(--gold2);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadeUp .2s;}

/* FORM */
.encode-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.encode-form .full{grid-column:1/-1;}
.field-group{display:flex;flex-direction:column;gap:5px;}
.field-group label{font-size:9px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;}
.field-group input,.field-group select,.field-group textarea{background:#fff;border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:'Mulish',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;appearance:none;}
.field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--gold);}
.field-group textarea{resize:vertical;min-height:75px;}
.form-actions{display:flex;gap:10px;align-items:center;grid-column:1/-1;margin-top:4px;}
.btn-submit{padding:10px 24px;border-radius:7px;border:none;background:var(--dark);color:#fff;font-family:'Mulish',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:background .2s,transform .1s;}
.btn-submit:hover{background:var(--dark2);transform:translateY(-1px);}
.btn-clear{padding:10px 18px;border-radius:7px;border:1.5px solid var(--border);background:transparent;color:var(--text-dim);font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .2s;}
.btn-clear:hover{border-color:var(--text-dim);}
.success-msg{color:var(--green2);font-size:12px;font-weight:600;}

/* RECORDS TABLE */
table.records-t{width:100%;border-collapse:collapse;font-size:12px;}
table.records-t th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border);background:var(--bg2);}
table.records-t td{padding:10px 12px;border-bottom:1px solid rgba(213,207,196,.5);}
table.records-t tr:last-child td{border-bottom:none;}
table.records-t tr:hover td{background:rgba(0,0,0,.015);}

/* OV GRID */
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.mini-list{list-style:none;}
.mini-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(213,207,196,.6);font-size:12px;}
.mini-list li:last-child{border-bottom:none;}
.mini-list .lbl{color:var(--text-dim);display:flex;align-items:center;gap:6px;}
.mini-list .val{font-weight:700;}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.priority-dot.high{background:var(--rust2);}
.priority-dot.med{background:var(--gold2);}
.priority-dot.low{background:var(--green2);}
.p-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;}
.p-pill.high{background:var(--rust-pale);color:var(--rust);}
.p-pill.med{background:var(--amber-pale);color:var(--amber);}
.p-pill.watch{background:var(--green-pale);color:var(--green);}
/* TRENDS PAGE */
.trends-intro{background:var(--dark);color:#fff;border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.trends-intro-text h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold2);margin-bottom:4px;}
.trends-intro-text p{font-size:12px;color:rgba(255,255,255,.55);line-height:1.6;}
.trends-badges{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.t-badge{padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;border:1px solid;}
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.chart-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px;}
.chart-card{background:var(--cream);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.chart-card.full{grid-column:1/-1;}
.chart-card-header{padding:14px 18px 10px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;}
.chart-card-header h4{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--dark);}
.chart-card-header .pillar-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.5px;}
.chart-body{padding:16px 18px 14px;}
.chart-wrap{position:relative;width:100%;}
canvas{display:block;width:100%!important;}
.chart-insight{margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:11px;color:var(--text-dim);line-height:1.6;border-left:3px solid var(--border);}
.chart-insight strong{color:var(--dark);font-weight:700;}
.chart-insight.warn{border-left-color:var(--rust2);}
.chart-insight.ok{border-left-color:var(--green2);}
.chart-insight.note{border-left-color:var(--gold2);}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
.pattern-card{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:16px;}
.pattern-card .pc-icon{font-size:22px;margin-bottom:8px;}
.pattern-card .pc-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.pattern-card .pc-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.pattern-card .pc-desc{font-size:11px;color:var(--text-dim);line-height:1.5;}
.pc-arrow-up{color:var(--green2);font-weight:700;}
.pc-arrow-down{color:var(--rust2);font-weight:700;}
.pc-arrow-flat{color:var(--amber);font-weight:700;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px;}
.empty-state .icon{font-size:28px;margin-bottom:10px;}
.legend{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-weight:600;}
.legend-dot{width:8px;height:8px;border-radius:50%;}
</style>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">P</div>
      <h1>PGB HR Dashboard</h1>
      <p>Primary Group of Builders · 2026</p>
    </div>
    <div class="form-group">
      <label>Role</label>
      <div class="select-wrap">
        <select id="login-role">
          <option value="">— Select your role —</option>
          <option value="strategic">Strategic HR</option>
          <option value="executive">Executive</option>
          <option value="talent">Talent Attraction</option>
          <option value="service">Service Delivery</option>
          <option value="osh">Occupational Safety &amp; Health</option>
          <option value="learning">Workplace Learning &amp; Performance</option>
          <option value="coe">Center of Excellence</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>PIN / Password</label>
      <input type="password" id="login-pin" placeholder="Enter your PIN">
    </div>

let DB={

  osh:JSON.parse(localStorage.getItem('pgb_osh')||'[]'),

  coe:JSON.parse(localStorage.getItem('pgb_coe')||'[]'),
};
function save(k){localStorage.setItem('pgb_'+k,JSON.stringify(DB[k]));}

let currentRole=null,currentPage=null;
function isViewOnly(){return CREDS[currentRole]&&CREDS[currentRole].access==='view';}

function doLogin(){
  const role=document.getElementById('login-role').value;
  const pin=document.getElementById('login-pin').value;
  const err=document.getElementById('login-error');
  if(!role){err.textContent='Please select a role.';return;}
  if(!CREDS[role]){err.textContent='Invalid role.';return;}
  if(pin!==CREDS[role].pin){err.textContent='Incorrect PIN. Please try again.';return;}
  err.textContent='';currentRole=role;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  setupApp();
}
document.getElementById('login-pin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogout(){
  currentRole=null;currentPage=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-pin').value='';
  document.getElementById('login-role').value='';
}

function setupApp(){
  const c=CREDS[currentRole];
  document.getElementById('header-pill').textContent=c.label;
  document.getElementById('user-avatar').textContent=c.initials;
  document.getElementById('user-avatar').style.background=c.color;

  const def=(currentRole==='strategic'||currentRole==='executive')?'overview':currentRole;
  goTo(def);
}

const CROSS_NAV=[
  {id:'overview',label:'Overview',dot:'#B8892A'},
  {id:'trends',label:'Trends & Patterns',dot:'#D4A843'},
  {id:'talent',label:'Talent Attraction',dot:'#1A7A8A'},
  {id:'service',label:'Service Delivery',dot:'#4A7C74'},
  {id:'osh',label:'OSH',dot:'#B5475A'},
  {id:'learning',label:'Learning & Perf.',dot:'#6E5F9E'},
  {id:'coe',label:'Center of Excellence',dot:'#2AABB0'},
];
const SINGLE_NAV={
  talent:[{id:'talent',label:'Talent Attraction',dot:'#1A7A8A'}],
  service:[{id:'service',label:'Service Delivery',dot:'#4A7C74'}],
  osh:[{id:'osh',label:'OSH',dot:'#B5475A'}],
  learning:[{id:'learning',label:'Learning & Perf.',dot:'#6E5F9E'}],
  coe:[{id:'coe',label:'Center of Excellence',dot:'#2AABB0'}],
};

function buildNav(){
  const nav=document.getElementById('sidebar');nav.innerHTML='';
  const isCross=currentRole==='strategic'||currentRole==='executive';
  const items=isCross?CROSS_NAV:(SINGLE_NAV[currentRole]||[]);
  if(isCross){const l=document.createElement('div');l.className='nav-section-label';l.textContent='Navigation';nav.appendChild(l);}
  items.forEach(item=>{
    const el=document.createElement('div');el.className='nav-item';el.dataset.id=item.id;
    el.innerHTML=`<span class="nav-dot" style="background:${item.dot}"></span><span>${item.label}</span>`;
    el.onclick=()=>goTo(item.id);nav.appendChild(el);
  });
}

function goTo(id){
  currentPage=id;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const main=document.getElementById('main-content');main.innerHTML='';
  switch(id){
    case 'overview':main.appendChild(pageOverview());break;
    case 'trends':main.appendChild(pageTrends());break;
    case 'talent':main.appendChild(pageTalent());break;
    case 'service':main.appendChild(pageService());break;
    case 'osh':main.appendChild(pageOSH());break;
    case 'learning':main.appendChild(pageLearning());break;
    case 'coe':main.appendChild(pageCOE());break;
  }
}

function el(tag,cls,html=''){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}

function kpiCard(label,value,sub,variant,badge,badgeCls){
  return `<div class="kpi-card ${variant}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div>${badge?`<div class="kpi-badge ${badgeCls}">${badge}</div>`:''}</div>`;
}
function scoreCard(label,value,sub,status,statusLabel){
  return `<div class="score-card ${status}"><div class="sc-badge ${status}">${statusLabel}</div><div class="sc-label">${label}</div><div class="sc-value">${value}</div><div class="sc-sub">${sub}</div></div>`;
}
function metricRow(label,actual,target,status,pct){
  const lbl=status==='on-track'?'On Track':status==='at-risk'?'At Risk':'Behind';
  return `<tr><td>${label}</td><td class="metric-actual">${actual}</td><td class="metric-target">${target}</td><td><span class="status-pill ${status}">${lbl}</span></td><td><div class="vs-bar"><div class="bar-track"><div class="bar-fill ${status}" style="width:${pct}%"></div></div></div></td></tr>`;
}
function monthOpts(){return ['January','February','March','April','May','June','July','August','September','October','November','December'].map(m=>`<option>${m}</option>`).join('');}
function pillarTabs(id){
  return `<div class="tabs">${isViewOnly()?'':`<div class="tab active" onclick="switchTab('${id}','encode')">Encode Data</div>`}<div class="tab ${isViewOnly()?'active':''}" onclick="switchTab('${id}','records')">View Records</div></div>`;
}

function switchTab(pillar,tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const panel=document.getElementById(`${pillar}-${tab}`);
  if(panel)panel.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.toLowerCase().includes(tab==='encode'?'encode':'view'))t.classList.add('active');});
  if(tab==='records')renderRecords(pillar);
}

function submitForm(pillar){
  const form=document.getElementById(`${pillar}-form`);
  const record={id:Date.now(),timestamp:new Date().toLocaleString()};
  form.querySelectorAll('input,select,textarea').forEach(inp=>{if(inp.name)record[inp.name]=inp.value;});
  DB[pillar].unshift(record);save(pillar);
  const msg=document.getElementById(`${pillar}-success`);
  msg.textContent='✓ Saved';setTimeout(()=>msg.textContent='',3000);
  renderRecords(pillar);
}
function clearForm(id){document.getElementById(id).querySelectorAll('input,textarea').forEach(e=>e.value='');}

function renderRecords(pillar){
  const body=document.getElementById(`${pillar}-records-body`);
  if(!body)return;
  const records=DB[pillar];
  if(!records.length){
    body.innerHTML=`<div class="empty-state"><div class="icon">📋</div>${isViewOnly()?'No records have been entered yet.':'No records yet. Use the Encode Data tab to add entries.'}</div>`;
    return;
  }
  const cols=COLS[pillar];
  let html=`<div style="overflow-x:auto"><table class="records-t"><thead><tr><th>#</th>`;
  cols.forEach(c=>html+=`<th>${COL_LABELS[c]||c}</th>`);
  if(!isViewOnly())html+=`<th></th>`;
  html+=`</tr></thead><tbody>`;
  records.forEach((r,i)=>{
    html+=`<tr><td style="color:var(--text-muted);font-size:11px">${records.length-i}</td>`;
    cols.forEach(c=>{
      const v=r[c]||'—';
      const display=c==='notes'?`<span title="${v}" style="max-width:130px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v}</span>`:v;
      html+=`<td>${display}</td>`;
    });
    if(!isViewOnly())html+=`<td><button onclick="deleteRecord('${pillar}',${r.id})" style="background:none;border:none;color:var(--rust2);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;" title="Delete">✕</button></td>`;
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  body.innerHTML=html;
}

      {yMin:0,yMax:1200,dualAxis:true});
    drawBarGroupChart('c-training',['January','February','March'],
      [{label:'Participants',data:[288,204,25],color:'#6E5F9E'},{label:'Sessions',data:[4,4,1],color:'#D4A843'}]);
    drawBarGroupChart('c-traincost',['Jan (EOS Townhall)','Feb (FAD EOS)','Mar (P&L)'],
      [{label:'Total Spend (₱K)',data:[158.4,88.8,5],color:'#6E5F9E'},{label:'Cost/Pax (₱)',data:[550,550,200],color:'#3D7A52'}]);
    drawLineChart('c-coe-part',['January','February','March'],
      [{label:'Avg Participation %',data:[69,104,111],color:'#2AABB0'}],
      {yMin:0,yMax:130,refLine:80,refLabel:'Target 80%'});
    drawBarChart('c-coe-cost',['January','February','March'],[52959,152079,144021],'#2AABB0',{yMax:200000,currency:true});
    // Multi-pillar normalized index (0-100 scale)
    drawLineChart('c-multi',['January','February','March'],
      [
        {label:'Headcount Index',data:[100,97.8,99.6],color:'#1A7A8A'},
        {label:'Hours Efficiency',data:[77.8,74.2,72.5],color:'#4A7C74'},
        {label:'Medical Cost Index',data:[18.2,100,18.3],color:'#B5475A'},
        {label:'Training Reach',data:[100,70.9,8.7],color:'#6E5F9E'},
        {label:'COE Participation',data:[69,104,111],color:'#2AABB0'},
      ],{yMin:0,yMax:130});
  },80);
  return wrap;
}

/* ─── CHART ENGINE ─── */
function getCtx(id){
  const canvas=document.getElementById(id);
  if(!canvas)return null;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=rect.width||canvas.offsetWidth||600;
  const h=parseInt(canvas.getAttribute('height'))||180;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return {ctx,w,h};
}

function palette(){return['#1A7A8A','#D4A843','#B04A35','#6E5F9E','#3D7A52','#2AABB0','#B8892A'];}

function drawLineChart(id,labels,datasets,opts={}){
  const g=getCtx(id); if(!g)return;
  const {ctx,w,h}=g;
  const pad={t:18,r:20,b:36,l:54};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const allVals=datasets.flatMap(d=>d.data);
  const mn=opts.yMin!==undefined?opts.yMin:Math.min(...allVals)*0.92;
  const mx=opts.yMax!==undefined?opts.yMax:Math.max(...allVals)*1.08;
  const range=mx-mn||1;

  ctx.clearRect(0,0,w,h);

  // grid
  ctx.strokeStyle='rgba(213,207,196,.5)'; ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=pad.t+ch*(1-t);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='#9A9A8E'; ctx.font='10px Mulish';ctx.textAlign='right';
    const val=mn+range*t;
    ctx.fillText(opts.currency?'₱'+fmtK(val):val%1===0?val.toFixed(0):val.toFixed(1),pad.l-6,y+3.5);
  });

  // ref line
  if(opts.refLine!==undefined){
    const ry=pad.t+ch*(1-(opts.refLine-mn)/range);
    ctx.setLineDash([4,3]); ctx.strokeStyle='rgba(176,74,53,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.l,ry);ctx.lineTo(pad.l+cw,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#B04A35'; ctx.font='9px Mulish';ctx.textAlign='left';
    ctx.fillText(opts.refLabel||'',pad.l+4,ry-4);
  }

  // x labels
  ctx.fillStyle='#9A9A8E'; ctx.font='10px Mulish'; ctx.textAlign='center';
  labels.forEach((lbl,i)=>{
    const x=pad.l+cw*(i/(labels.length-1||1));
    ctx.fillText(lbl,x,h-pad.b+14);
  });

  // lines
  datasets.forEach(ds=>{
    const pts=ds.data.map((v,i)=>({
      x:pad.l+cw*(i/(labels.length-1||1)),
      y:pad.t+ch*(1-(v-mn)/range)
    }));
    // area fill
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pad.t+ch);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(pts[pts.length-1].x,pad.t+ch);
    ctx.closePath();
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
    grad.addColorStop(0,ds.color+'28'); grad.addColorStop(1,ds.color+'04');
    ctx.fillStyle=grad; ctx.fill();
    // line
    ctx.beginPath(); ctx.strokeStyle=ds.color; ctx.lineWidth=2.5; ctx.lineJoin='round';
    pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
    // dots
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fillStyle='#FAF8F4'; ctx.fill();
      ctx.strokeStyle=ds.color; ctx.lineWidth=2; ctx.stroke();
    });
    // value labels
    ctx.fillStyle=ds.color; ctx.font='bold 9px Mulish'; ctx.textAlign='center';
    pts.forEach((p,i)=>{
      const v=ds.data[i];
      ctx.fillText(opts.currency?'₱'+fmtK(v):v%1===0?v:v.toFixed(1),p.x,p.y-9);
    });
  });
  // legend
  if(datasets.length>1){
    let lx=pad.l; const ly=pad.t-4;
    datasets.forEach(ds=>{
      ctx.fillStyle=ds.color; ctx.fillRect(lx,ly,10,4);
      ctx.fillStyle='#6B6B60'; ctx.font='9px Mulish'; ctx.textAlign='left';
      ctx.fillText(ds.label,lx+13,ly+4);
      lx+=ctx.measureText(ds.label).width+28;
    });
  }
}

function drawBarChart(id,labels,data,color,opts={}){
  const g=getCtx(id); if(!g)return;
  const {ctx,w,h}=g;
  const pad={t:18,r:20,b:36,l:54};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const mx=opts.yMax||Math.max(...data)*1.15;
  const mn=opts.yMin||0;
  const range=mx-mn;
  ctx.clearRect(0,0,w,h);
  // grid
  ctx.strokeStyle='rgba(213,207,196,.5)'; ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=pad.t+ch*(1-t);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='#9A9A8E';ctx.font='10px Mulish';ctx.textAlign='right';
    const val=mn+range*t;
    ctx.fillText(opts.currency?'₱'+fmtK(val):val.toFixed(1)+'%',pad.l-6,y+3.5);
  });
  if(opts.refLine!==undefined){
    const ry=pad.t+ch*(1-(opts.refLine-mn)/range);
    ctx.setLineDash([4,3]); ctx.strokeStyle='rgba(176,74,53,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.l,ry);ctx.lineTo(pad.l+cw,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#B04A35';ctx.font='9px Mulish';ctx.textAlign='left';
    ctx.fillText(opts.refLabel||'',pad.l+4,ry-4);
  }
  const bw=cw/labels.length*0.55;
  const gap=cw/labels.length;
  data.forEach((v,i)=>{
    const bh=ch*(v-mn)/range;
    const x=pad.l+gap*i+gap*0.225;
    const y=pad.t+ch-bh;
    const grad=ctx.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0,color); grad.addColorStop(1,color+'88');
    ctx.fillStyle=grad;
    ctx.beginPath(); roundRect(ctx,x,y,bw,bh,4); ctx.fill();
    ctx.fillStyle=color; ctx.font='bold 10px Mulish'; ctx.textAlign='center';
    ctx.fillText(opts.currency?'₱'+fmtK(v):v.toFixed(1)+'%',x+bw/2,y-6);
    ctx.fillStyle='#9A9A8E'; ctx.font='10px Mulish';
    ctx.fillText(labels[i],x+bw/2,h-pad.b+14);
  });
}

function drawBarGroupChart(id,labels,datasets){
  const g=getCtx(id); if(!g)return;
  const {ctx,w,h}=g;
  const pad={t:22,r:20,b:36,l:54};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const allVals=datasets.flatMap(d=>d.data);
  const mx=Math.max(...allVals)*1.15||1;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(213,207,196,.5)'; ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=pad.t+ch*(1-t);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='#9A9A8E';ctx.font='10px Mulish';ctx.textAlign='right';
    ctx.fillText((mx*t).toFixed(0),pad.l-6,y+3.5);
  });
  const groupW=cw/labels.length;
  const bw=groupW*0.32;
  labels.forEach((lbl,gi)=>{
    datasets.forEach((ds,di)=>{
      const v=ds.data[gi];
      const bh=ch*(v/mx);
      const x=pad.l+groupW*gi+groupW*0.1+di*(bw+3);
      const y=pad.t+ch-bh;
      const grad=ctx.createLinearGradient(0,y,0,y+bh);
      grad.addColorStop(0,ds.color); grad.addColorStop(1,ds.color+'77');
      ctx.fillStyle=grad;
      ctx.beginPath(); roundRect(ctx,x,y,bw,bh,3); ctx.fill();
      ctx.fillStyle=ds.color; ctx.font='bold 9px Mulish'; ctx.textAlign='center';
      ctx.fillText(v,x+bw/2,y-5);
    });
    ctx.fillStyle='#9A9A8E'; ctx.font='10px Mulish'; ctx.textAlign='center';
    ctx.fillText(lbl,pad.l+groupW*gi+groupW/2,h-pad.b+14);
  });
  // legend
  let lx=pad.l;
  datasets.forEach(ds=>{
    ctx.fillStyle=ds.color; ctx.fillRect(lx,pad.t-10,10,4);
    ctx.fillStyle='#6B6B60'; ctx.font='9px Mulish'; ctx.textAlign='left';
    ctx.fillText(ds.label,lx+13,pad.t-6);
    lx+=ctx.measureText(ds.label).width+28;
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function fmtK(v){
  if(v>=1000000)return (v/1000000).toFixed(2)+'M';
  if(v>=1000)return (v/1000).toFixed(0)+'K';
  return v.toFixed(0);
}

function deleteRecord(pillar,id){
  if(!confirm('Delete this record?'))return;
  DB[pillar]=DB[pillar].filter(r=>r.id!==id);save(pillar);
  renderRecords(pillar);
  if(['strategic','executive'].includes(currentRole)&&currentPage==='overview')goTo('overview');
}
